<svg width="400" height="360" viewBox="0 0 200 180" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Bloomstudy ロゴ(縦組み・アニメーション)</title>
<desc>5枚の花びらが順番に開き、続けてロゴ文字がフェードインするアニメーション(1回再生)</desc>

<g transform="translate(100,55) scale(2)">

  <g transform="rotate(0)">
    <g>
      <animateTransform attributeName="transform" type="scale"
        values="0.15;0.15;1.1;1;1"
        keyTimes="0;0;0.15;0.25;1"
        dur="2.4s" repeatCount="1" calcMode="linear" fill="freeze"/>
      <ellipse cx="0" cy="-10" rx="6.5" ry="9.5" fill="#5DCAA5">
        <animate attributeName="opacity" values="0;0;1;1;1" keyTimes="0;0;0.15;0.25;1" dur="2.4s" repeatCount="1" fill="freeze"/>
      </ellipse>
    </g>
  </g>

  <g transform="rotate(72)">
    <g>
      <animateTransform attributeName="transform" type="scale"
        values="0.15;0.15;1.1;1;1"
        keyTimes="0;0.0417;0.1917;0.2917;1"
        dur="2.4s" repeatCount="1" calcMode="linear" fill="freeze"/>
      <ellipse cx="0" cy="-10" rx="6.5" ry="9.5" fill="#3FBE93">
        <animate attributeName="opacity" values="0;0;1;1;1" keyTimes="0;0.0417;0.1917;0.2917;1" dur="2.4s" repeatCount="1" fill="freeze"/>
      </ellipse>
    </g>
  </g>

  <g transform="rotate(144)">
    <g>
      <animateTransform attributeName="transform" type="scale"
        values="0.15;0.15;1.1;1;1"
        keyTimes="0;0.0833;0.2333;0.3333;1"
        dur="2.4s" repeatCount="1" calcMode="linear" fill="freeze"/>
      <ellipse cx="0" cy="-10" rx="6.5" ry="9.5" fill="#5DCAA5">
        <animate attributeName="opacity" values="0;0;1;1;1" keyTimes="0;0.0833;0.2333;0.3333;1" dur="2.4s" repeatCount="1" fill="freeze"/>
      </ellipse>
    </g>
  </g>

  <g transform="rotate(216)">
    <g>
      <animateTransform attributeName="transform" type="scale"
        values="0.15;0.15;1.1;1;1"
        keyTimes="0;0.125;0.275;0.375;1"
        dur="2.4s" repeatCount="1" calcMode="linear" fill="freeze"/>
      <ellipse cx="0" cy="-10" rx="6.5" ry="9.5" fill="#3FBE93">
        <animate attributeName="opacity" values="0;0;1;1;1" keyTimes="0;0.125;0.275;0.375;1" dur="2.4s" repeatCount="1" fill="freeze"/>
      </ellipse>
    </g>
  </g>

  <g transform="rotate(288)">
    <g>
      <animateTransform attributeName="transform" type="scale"
        values="0.15;0.15;1.1;1;1"
        keyTimes="0;0.1667;0.3167;0.4167;1"
        dur="2.4s" repeatCount="1" calcMode="linear" fill="freeze"/>
      <ellipse cx="0" cy="-10" rx="6.5" ry="9.5" fill="#5DCAA5">
        <animate attributeName="opacity" values="0;0;1;1;1" keyTimes="0;0.1667;0.3167;0.4167;1" dur="2.4s" repeatCount="1" fill="freeze"/>
      </ellipse>
    </g>
  </g>

  <g>
    <animateTransform attributeName="transform" type="scale"
      values="0;0;1.2;1;1"
      keyTimes="0;0.2292;0.375;0.4375;1"
      dur="2.4s" repeatCount="1" calcMode="linear" fill="freeze"/>
    <circle cx="0" cy="0" r="4.5" fill="#0F6E56">
      <animate attributeName="opacity" values="0;0;1;1;1" keyTimes="0;0.2292;0.375;0.4375;1" dur="2.4s" repeatCount="1" fill="freeze"/>
    </circle>
  </g>

</g>

<text x="100" y="140" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="500" font-size="34" fill="#23292B">
  Bloomstudy
  <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3333;0.5417;1" dur="2.4s" repeatCount="1" fill="freeze"/>
</text>

</svg>
